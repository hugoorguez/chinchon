<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chinchón</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Chinchón</h1>
    </header>

    <main>
        <div class="players">
            <!-- 9 jugadores -->
            <!-- Cada bloque imita nombreX, puntuacionX, editX, rX -->
            <!-- Jugador 1 -->
            <div class="player">
                <input id="nombre1" class="nombre" placeholder="Nombre 1">
                <span id="puntuacion1" class="puntuacion">0</span>
                <input id="edit1" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r1" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre2" class="nombre" placeholder="Nombre 2">
                <span id="puntuacion2" class="puntuacion">0</span>
                <input id="edit2" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r2" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre3" class="nombre" placeholder="Nombre 3">
                <span id="puntuacion3" class="puntuacion">0</span>
                <input id="edit3" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r3" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre4" class="nombre" placeholder="Nombre 4">
                <span id="puntuacion4" class="puntuacion">0</span>
                <input id="edit4" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r4" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre5" class="nombre" placeholder="Nombre 5">
                <span id="puntuacion5" class="puntuacion">0</span>
                <input id="edit5" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r5" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre6" class="nombre" placeholder="Nombre 6">
                <span id="puntuacion6" class="puntuacion">0</span>
                <input id="edit6" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r6" class="rondas"></span>
            </div>

            <div class="player">
                <input id="nombre7" class="nombre" placeholder="Nombre 7">
                <span id="puntuacion7" class="puntuacion">0</span>
                <input id="edit7" class="edit" type="number" placeholder="Puntos ronda">

            </div>

            <div class="player">

            </div>

            <div class="player">
                <input id="nombre9" class="nombre" placeholder="Nombre 9">
                <span id="puntuacion9" class="puntuacion">0</span>
                <input id="edit9" class="edit" type="number" placeholder="Puntos ronda">
                <span id="r9" class="rondas"></span>
            </div>
        </div>

        <div class="controls">
            <button id="apuntar">Apuntar ronda</button>
            <button id="menos10">-10</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
